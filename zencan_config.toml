device_name = "CANShunt"
software_version = "v0.3.0"
hardware_version = "rev2"
heartbeat_period = 1000
autostart = "enabled"

[identity]
vendor_id = 0xCAFE
product_code = 1050
revision_number = 2

[pdos]
num_tpdo = 4

[pdos.tpdo.0]
enabled = true
cob_id = 0x200
add_node_id = false
transmission_type = 254
mappings = [
    { index=0x2010, sub=1, size=16 },
    { index=0x2010, sub=2, size=16 },
    { index=0x2010, sub=3, size=16 },
    { index=0x2010, sub=4, size=16 },
]
[pdos.tpdo.1]
enabled = true
cob_id = 0x201
add_node_id = false
transmission_type = 254
mappings = [
    { index=0x2010, sub=5, size=16 },
    { index=0x2010, sub=6, size=16 },
    { index=0x2010, sub=7, size=16 },
    { index=0x2010, sub=8, size=16 },
]
[pdos.tpdo.2]
enabled = true
cob_id = 0x202
add_node_id = false
transmission_type = 254
mappings = [
    { index=0x2011, sub=1, size=16 },
    { index=0x2011, sub=2, size=16 },
    { index=0x2011, sub=3, size=16 },
    { index=0x2011, sub=4, size=16 },
]
[pdos.tpdo.3]
enabled = true
cob_id = 0x203
add_node_id = false
transmission_type = 254
