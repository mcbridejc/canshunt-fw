    { index=0x2011, sub=5, size=16 },
    { index=0x2011, sub=6, size=16 },
    { index=0x2011, sub=7, size=16 },
    { index=0x2011, sub=8, size=16 },
]

# The raw 12-bit ADC readings for current sensors
[[objects]]
index = 0x2000
parameter_name = "Raw INA183 Input"
object_type = "array"
data_type = "uint16"
access_type = "ro"
array_size = 8
pdo_mapping = "tpdo"

# The raw 12-bit ADC readings for voltage sensors
[[objects]]
index = 0x2001
parameter_name = "Raw Voltage Input"
object_type = "array"
data_type = "uint16"
access_type = "ro"
array_size = 8
pdo_mapping = "tpdo"

[[objects]]
index = 0x2010
parameter_name = "Current (mA)"
object_type = "array"
data_type = "uint16"
access_type = "ro"
array_size = 8
pdo_mapping = "tpdo"

[[objects]]
index = 0x2011
parameter_name = "Voltage (mV)"
object_type = "array"
data_type = "uint16"
access_type = "ro"
array_size = 8
pdo_mapping = "tpdo"

# Counts per 10A for INA sensors
[[objects]]
index = 0x2100
parameter_name = "Current Scale"
#description = "Current calibration factor. Factory set, but can be adjusted."
object_type = "var"
data_type = "uint16"
access_type = "rw"
default_value = 1943
persist = true

[[objects]]
index = 0x2200
parameter_name = "Bitrate Config"
#description = "0 - 1000k, 1 - 800k, 2 - 500k, 3 - 250k, 4 - 125k, 5 - 100k, 6 - 50k"
object_type = "var"
data_type = "uint8"
access_type = "rw"
default_value = 2
persist = true

[[objects]]
index = 0x2f80
parameter_name = "Identify Command"
object_type = "var"
data_type = "uint8"
access_type = "rw"
